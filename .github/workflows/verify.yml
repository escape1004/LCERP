name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Verify lint, types, tests, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache the npm download cache only. Installs always use npm ci, so a
          # lockfile mismatch still fails instead of reusing node_modules.
          cache: npm

      - name: Install Linux libraries for Electron-as-Node tests
        run: |
          set -euo pipefail
          sudo apt-get update

          is_installable() {
            local candidate
            candidate="$(apt-cache policy "$1" 2>/dev/null | awk '/Candidate:/ { print $2; exit }')"
            [ -n "$candidate" ] && [ "$candidate" != '(none)' ]
          }

          resolve_pkg() {
            local pkg
            for pkg in "$@"; do
              if is_installable "$pkg"; then
                printf '%s\n' "$pkg"
                return 0
              fi
            done
            echo "None of these packages have an installation candidate: $*" >&2
            return 1
          }

          # Ubuntu 24.04 renamed several Electron runtime libs with a t64 suffix.
          # Prefer the current name, then the older name, and fail only if neither exists.
          packages=(
            "$(resolve_pkg libnss3)"
            "$(resolve_pkg libgbm1)"
            "$(resolve_pkg libasound2t64 libasound2)"
            "$(resolve_pkg libatk-bridge2.0-0t64 libatk-bridge2.0-0)"
            "$(resolve_pkg libgtk-3-0t64 libgtk-3-0)"
          )

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        env:
          CI: true
          ELECTRON_RUN_AS_NODE: '1'
        run: npm test

      - name: Verify Electron IPC contracts
        run: npm run verify:electron-contracts

      - name: Build production Electron main and renderer
        run: npm run build

  verify-windows-package:
    name: Verify Windows Electron package
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache the npm download cache only. Installs always use npm ci, so a
          # lockfile mismatch still fails instead of reusing node_modules.
          cache: npm

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        env:
          CI: true
          ELECTRON_RUN_AS_NODE: '1'
        run: npm test

      - name: Verify Electron IPC contracts
        run: npm run verify:electron-contracts

      - name: Build production Electron main and renderer
        run: npm run build

      - name: Package unpacked Windows app without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --dir --win --publish never
